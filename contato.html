<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Dream Studio</title>
    
    <!-- Importando as mesmas fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #111; /* Mesmo fundo escuro */
            color: #f1f1f1;
            padding: 50px;
        }

        /* Menu simples para voltar à página inicial */
        nav {
            margin-bottom: 50px;
        }

        nav a {
            color: #d4b872; /* Tom dourado */
            text-decoration: none;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #fff;
        }

        /* Área do seu texto */
        .container {
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.8;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #e5cc98;
            font-size: 2.5rem;
            margin-bottom: 30px;
            font-style: italic;
            font-weight: 400;
        }
        
        p {
            margin-bottom: 20px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <!-- Link para voltar para a página inicial -->
    <nav>
        <a href="index.html">← Voltar para a Home</a>
    </nav>

    <!-- Aqui é onde você vai colocar o seu texto depois -->
    <div class="container">
        <!-- ALTERE O TÍTULO ABAIXO CONFORME A PÁGINA (Sobre, Projetos Culturais, ou Contato) -->
        <h1>Contato</h1>
        
        <p>Aqui você pode digitar todo o texto da página. Pode apagar isso e colocar a história do estúdio, os detalhes dos projetos ou as informações de contato.</p>
        <p>Para criar novos parágrafos, basta usar a tag &lt;p&gt; seu texto aqui &lt;/p&gt; como neste exemplo.</p>
    </div>

</body>
</html>
